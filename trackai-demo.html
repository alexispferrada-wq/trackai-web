<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>TrackAI v2.3.1 — Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { color-scheme: dark; }
  html, body { height: 100%; width: 100%; overflow: hidden; }

  body {
    --bg-glass: #000000;
    --bg-solid: #000000;
    --panel: transparent;
    --panel-solid: #000000;
    --panel-hover: transparent;
    --row: transparent;
    --row-alt: transparent;
    --border: rgba(255, 255, 255, 0.09);
    --border-soft: rgba(255, 255, 255, 0.04);
    --text: #ffffff;
    --text-dim: #c5cce0;
    --text-faint: #a0a8b8;
    --accent: #2f80ed;
    --accent-soft: rgba(47, 128, 237, 0.16);
    --key: #b877e0;
    --key-soft: rgba(184, 119, 224, 0.16);
    --bpm: #d7dbe2;
    --crate: #e8862a;
    --crate-soft: transparent;
    --green: #46c37b;
    --red: #ff5a5f;
    --yellow: #f2c14e;
    --shadow: 0 10px 34px rgba(0, 0, 0, 0.45);
    --hi: rgba(255, 255, 255, 0.06);
    --header-bg: #000000;
    font-family: 'Segoe UI', 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', system-ui, sans-serif;
    background: #000000;
    color: var(--text);
    font-size: 12px;
    overflow: hidden;
  }

  .container {
    width: 100%; height: 100vh;
    background: #000000;
    display: flex; flex-direction: column;
    overflow: hidden;
    border: none; border-radius: 0;
  }

  .header {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border-soft);
    background: #000000;
    overflow: visible; flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .header-center { display: flex; align-items: center; gap: 14px; flex: 1 1 auto; justify-content: center; }
  .header-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; margin-left: auto; }

  .wordmark { font-size: 12px; font-weight: 800; color: var(--text); white-space: nowrap; }

  .clock { font-size: 13px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: 0.5px; }

  .header-btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 7px; font-size: 11px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    height: 26px; padding: 0 8px; flex-shrink: 0; white-space: nowrap;
  }

  /* LAYOUT HORIZONTAL */
  .layout-horizontal .header { padding: 5px 10px; }
  .layout-horizontal #app {
    display: flex; flex-direction: row; align-items: stretch; gap: 0;
    padding: 0; overflow: hidden; flex: 1 1 auto;
  }

  /* BARRA DE MODOS */
  .mode-bar {
    display: flex; flex-direction: column; width: 60px; flex: 0 0 60px; margin: 0; padding: 4px 2px; gap: 4px;
    flex-shrink: 0; background: transparent; border: none !important;
    border-right: 1px solid rgba(255,255,255,0.15) !important;
    justify-content: space-between; align-items: center; box-sizing: border-box; height: 100%;
  }
  .mode-btn {
    flex: 1 1 0; min-height: 24px; width: 100%; box-sizing: border-box;
    font-size: 8.5px; font-weight: 800; padding: 2px 1px; line-height: 1.05;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;
    border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03);
    cursor: pointer; color: #c5cce0;
  }
  .mode-btn.active {
    color: #ffffff; font-weight: 900;
    background: rgba(47, 128, 237, 0.25); border-color: #2f80ed;
    box-shadow: 0 0 10px rgba(47, 128, 237, 0.4), inset 0 0 6px rgba(255,255,255,0.15);
  }

  /* HERO WRAPPER (now + livepitch) */
  .hero-wrapper {
    flex: 1 1 0; width: 50%; min-width: 0;
    display: flex; flex-direction: row; gap: 0; align-items: stretch;
    border-right: 1px solid rgba(255,255,255,0.15) !important;
    position: relative;
  }

  /* NOW PLAYING */
  .now {
    flex: 1 1 0; min-width: 0; margin: 0 !important;
    padding: 6px 8px !important;
    border-radius: 0 !important;
    border: none !important; box-shadow: none !important;
    background: transparent !important;
    display: flex; flex-direction: column; justify-content: space-between; gap: 3px;
    overflow: hidden; position: relative;
    border-right: 1px solid rgba(255,255,255,0.15) !important;
  }
  .card-section-tag {
    font-size: 9.5px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
    color: #ffffff !important; margin-bottom: 4px; display: flex; align-items: center; gap: 4px;
    text-shadow: 0 0 6px rgba(255,255,255,0.4);
  }
  .now .title {
    font-size: 15px; font-weight: 900; color: var(--text); line-height: 1.2;
    text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    width: 100%; text-align: left; box-sizing: border-box; margin-bottom: 2px;
  }
  .now .artist {
    font-size: 11px; color: var(--text-dim); margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600;
  }
  .audio-bars { display: flex; gap: 3px; align-items: flex-end; height: 14px; margin: 4px 0 2px; }
  .audio-bars .bar { width: 3px; border-radius: 99px; background: var(--accent); animation: eq 0.9s ease-in-out infinite; opacity: 0.85; }
  .audio-bars .bar:nth-child(1){ height: 40%; animation-delay: 0s; }
  .audio-bars .bar:nth-child(2){ height: 80%; animation-delay: 0.15s; }
  .audio-bars .bar:nth-child(3){ height: 55%; animation-delay: 0.3s; }
  .audio-bars .bar:nth-child(4){ height: 95%; animation-delay: 0.1s; }
  .audio-bars .bar:nth-child(5){ height: 60%; animation-delay: 0.25s; }
  @keyframes eq { 0%,100%{ transform: scaleY(0.5);} 50%{ transform: scaleY(1);} }
  @keyframes spin { to { transform: rotate(360deg); } }

  .meta { display: flex; gap: 5px; flex-wrap: wrap; }
  .chip {
    font-size: 9.5px; font-weight: 700; border-radius: 99px; padding: 2px 6px;
    background: var(--panel-hover); border: 1px solid var(--border); color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .chip.key { color: var(--key); border-color: var(--key); background: var(--key-soft); }
  .chip.bpm { color: var(--bpm); }
  .chip.deck { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

  /* LIVE PITCH */
  .livepitch {
    flex: 1 1 0; min-width: 0; margin: 0 !important;
    padding: 6px 8px !important;
    border-radius: 0 !important;
    border: none !important;
    background: linear-gradient(180deg, rgba(0, 210, 255, 0.08) 0%, rgba(0, 0, 0, 0.3) 100%) !important;
    box-shadow: inset 0 0 20px rgba(0, 210, 255, 0.08) !important;
    display: flex; flex-direction: column; justify-content: center;
    position: relative; overflow: hidden;
  }
  .lp-fg {
    display: flex; flex-direction: column; justify-content: center;
    height: 100%; padding: 0; max-width: none; margin: 0; width: 100%; box-sizing: border-box;
  }
  .lp-topline { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .lp-brand { font-size: 10.5px; font-weight: 900; letter-spacing: 1.2px; color: #fff; text-shadow: 0 2px 10px #ffca28, 0 0 5px #ffca28; }
  .lp-brand sup { font-size: 6.5px; opacity: 0.9; }
  .lp-trend-pill { font-size: 10px; font-weight: 900; padding: 3px 9px; border-radius: 999px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.14); white-space: nowrap; }
  .lp-bpmbig {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 4px 8px; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,202,40,0.45);
    border-radius: 11px; cursor: pointer;
    box-shadow: inset 0 0 12px rgba(0,0,0,0.85), 0 0 16px rgba(255,202,40,0.18);
    min-width: 0; width: 100%; box-sizing: border-box;
  }
  .lp-bpmbig > b { font-size: 32px; line-height: 1; font-weight: 900; color: #ffca28; font-family: 'SF Mono', ui-monospace, monospace; letter-spacing: -0.5px; margin-top: 2px; display: block; }
  .lp-bpmbig .sub { font-size: 9px; color: #fff; opacity: 0.88; font-weight: 700; margin-top: 3px; white-space: nowrap; letter-spacing: 0.2px; }
  .lp-bpmbig .bpm-label { font-size: 10px; color: #ffca28; font-weight: 800; letter-spacing: 1px; }
  .lp-controls { gap: 4px; display: flex; flex-direction: column; align-items: center; }

  .hp-icon-anim {
    display: inline-block;
    animation: hp-headphone-bounce 1.5s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 6px #00d2ff);
  }
  @keyframes hp-headphone-bounce {
    0% { transform: scale(1) rotate(-6deg); filter: drop-shadow(0 0 4px #00d2ff); }
    50% { transform: scale(1.3) rotate(0deg); filter: drop-shadow(0 0 12px #00ffcc); }
    100% { transform: scale(1) rotate(6deg); filter: drop-shadow(0 0 4px #00d2ff); }
  }
  .lp-help { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; max-width: 100%; text-align: center; font-size: 9px; color: #ffca28; opacity: 0.82; font-weight: 600; line-height: 1.3; }

  /* SUGGESTIONS SECTION */
  .sug-section {
    flex: 1 1 0; width: 50%; min-width: 0;
    display: flex; flex-direction: row; align-items: stretch;
  }
  .sug-row {
    flex: 1 1 0; width: 50%;
    display: flex; flex-direction: row; align-items: stretch; min-width: 0;
    border-right: 1px solid rgba(255,255,255,0.15) !important;
  }
  .sug-row:last-child { border-right: none !important; }
  .tracks-container { display: contents; }
  .track {
    flex: 1 1 0; min-width: 0; border: none !important; border-radius: 0 !important;
    box-shadow: none !important; background: transparent !important; padding: 8px 10px;
    box-sizing: border-box; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative;
  }
  .track .t {
    font-size: 17px; font-weight: 900; line-height: 1.1; text-transform: uppercase; letter-spacing: -0.3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 0;
    color: var(--text);
  }
  .track .a {
    display: flex; font-size: 10px; color: var(--text-dim); margin-top: 1px;
    white-space: nowrap; align-items: center; gap: 4px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis;
  }
  .track-bottom {
    margin-top: auto; flex-wrap: nowrap; align-items: center; justify-content: space-between;
    padding-top: 5px; border-top: 1px solid var(--border-soft);
    display: flex; gap: 6px;
  }
  .tb-left { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; max-width: calc(100% - 110px); }
  .actions { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }

  .badge {
    font-size: 8px; font-weight: 800; border-radius: 4px; padding: 2px 6px;
    background: var(--panel); border: 1px solid var(--border-soft); color: var(--text-dim);
    white-space: nowrap; letter-spacing: 0.2px; line-height: 1;
  }
  .badge.trans.perfect { color: var(--green); border-color: var(--green); }
  .badge.trans.relative { color: var(--accent); border-color: var(--accent); }
  .badge.bpmx { color: var(--accent); border-color: var(--accent); }
  .badge.crate { color: var(--crate); border-color: var(--crate); }
  .badge.crate.same-crate { color: var(--green); border-color: var(--green); background: rgba(70,195,123,0.15); }

  .load-btn {
    font-size: 10px; font-weight: 900; padding: 4px 10px; border-radius: 6px; letter-spacing: 0.3px;
    background: rgba(70,195,123,0.12); border: 1px solid rgba(70,195,123,0.5); color: var(--green);
    cursor: pointer;
  }
  .deck-btn { font-size: 10px; font-weight: 900; padding: 4px 8px; border-radius: 6px; cursor: pointer; background: rgba(47,128,237,0.12); border: 1px solid rgba(47,128,237,0.4); color: var(--accent); }

  /* COMODIN SLOT (searching) */
  #comodin-slot {
    flex: 1 1 0; width: 50%; min-width: 0; margin: 0;
    display: flex; align-items: stretch;
  }
  #comodin-slot .searching { align-self: center; }
  #comodin-slot .track { flex: 1 1 0; min-width: 0; width: 100%; }

  /* SEARCHING ANIMATION */
  .searching { color: var(--text-dim); font-size: 11px; font-weight: 600; }
  .searching-dots::after { content: ''; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots { 0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} }

  @keyframes aiScanBeam {
    0% { transform: translateY(-100%) scaleX(0.5); opacity: 0; }
    50% { opacity: 0.85; }
    100% { transform: translateY(100%) scaleX(1.5); opacity: 0; }
  }
  .ai-scan-beam {
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, #00d2ff, #ffca28, #00d2ff, transparent);
    box-shadow: 0 0 12px #00d2ff, 0 0 20px #ffca28;
    animation: aiScanBeam 1.8s linear infinite;
    pointer-events: none; z-index: 2;
  }
  .brain-glow-ring {
    position: absolute; inset: -4px;
    border-radius: 50%;
    border: 2px solid rgba(0, 210, 255, 0.6);
    border-top-color: #ffca28;
    animation: spin 1.2s linear infinite;
    box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
  }
  @keyframes brainPulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #00d2ff); }
    50% { transform: scale(1.2); filter: drop-shadow(0 0 12px #ffca28); }
  }
  @keyframes searchingPulse { 0%,100% { opacity:1; } 50% { opacity:0.45; } }

  /* Fade transition for demo cycling */
  .demo-fade-out { animation: fadeOut 0.5s ease forwards; }
  .demo-fade-in { animation: fadeIn 0.5s ease forwards; }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body class="layout-horizontal">
<div class="container">
  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div style="width: 24px; height: 24px; border-radius: 7px; overflow: hidden; border: 1.5px solid #007dff; box-shadow: 0 0 10px rgba(0,125,255,0.4); flex-shrink: 0; background: #0c0d12; display:flex; align-items:center; justify-content:center;">
        <span style="font-size:14px;">🎧</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px;">
        <div style="font-weight: 900; letter-spacing: -0.5px; font-size: 15px; color: #ffffff; line-height: 1;">
          Track<span style="color: #007dff;">AI</span>
        </div>
        <span style="font-size:9px;color:#c5cce0;font-weight:700;line-height:1;">v2.3.1</span>
      </div>

    <div class="header-center">
      <div class="clock" id="demoClock">🕒 00:00</div>
      <div style="display:flex; align-items:center; padding:3px 8px; font-size:11px; border:1px solid #00ff66; color:#00ff66; background:rgba(0, 255, 102, 0.18); border-radius:99px; gap:4px; box-shadow: 0 0 12px rgba(0,255,102,0.3);">
        <span style="font-size:11px;">🌿</span> <b style="white-space:nowrap;">REGGAETON · TROPICAL</b>
      </div>
    </div>

    <div class="header-right">
      <div style="display:flex; align-items:center; gap: 4px; font-size:9.5px; color:#c5cce0; margin-right:8px;">
        <div style="color:#2f80ed; font-weight:800; background:rgba(47,128,237,0.16); padding:3px 6px; border-radius:4px; border:1px solid #2f80ed;">⭐ PRO</div>
      </div>
      <div class="header-btn" style="background: rgba(255,202,40,0.1); border-color: rgba(255,202,40,0.4); color: #ffca28;">🌙</div>
      <div class="header-btn">–</div>
      <div class="header-btn" style="border-color: rgba(255,90,95,0.4); color: #ff5a5f;">✕</div>
    </div>
  </div>

  <!-- APP HORIZONTAL -->
  <div id="app">

    <!-- FASE 1: MODOS (60px fijo) -->
    <div class="mode-bar">
      <button class="mode-btn active"><span>⚖️</span><span>Auto</span></button>
      <button class="mode-btn"><span>🚀</span><span>Ultra IA</span></button>
      <button class="mode-btn"><span>📁</span><span>Estricto</span></button>
      <button class="mode-btn"><span>🔥</span><span>Arriba</span></button>
      <button class="mode-btn"><span>📉</span><span>Bajada</span></button>

    <!-- FASE 2: SONANDO AHORA + LIVE PITCH -->
    <div class="hero-wrapper">
      <!-- SONANDO AHORA -->
      <div class="now">
        <div>
          <div class="card-section-tag" style="color:#ffffff !important; letter-spacing: 2.5px; text-align:center; display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom: 6px;">
            <span style="width:16px;height:1px;background:rgba(255,255,255,0.35);display:inline-block;"></span>
            🎵 SONANDO AHORA
            <span style="width:16px;height:1px;background:rgba(255,255,255,0.35);display:inline-block;"></span>
          </div>
          <div class="title" id="nowTitle">DAKITI</div>
          <div class="artist" id="nowArtist">Bad Bunny ft. Jhay Cortez</div>
        </div>
        <div class="audio-bars">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div>
        </div>
        <div class="meta">
          <span class="chip key">7B</span>
          <span class="chip bpm">95.0 BPM</span>
          <span class="chip deck">Plato A</span>
        </div>
      </div>

      <!-- LIVE PITCH -->
      <div class="livepitch">
        <div class="lp-fg">
          <div class="lp-topline">
            <span class="lp-brand"><span class="hp-icon-anim">🎧</span> LIVE PITCH<sup>®</sup></span>
            <span class="lp-trend-pill" style="color: #46c37b;">▲ +1.2%</span>

  </div><!-- /#app -->
</div><!-- /.container -->

<script>
  // Live clock
  function tick() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('demoClock').textContent = `🕒 ${h}:${m}`;
  }
  tick();
  setInterval(tick, 10000);

  // Demo data for cycling
  const demoTracks = [
    { title: 'CON CALMA', artist: 'Daddy Yankee ft. Snow', key: '9A', bpm: '96.0', trans: 'perfect', transLabel: '✓ Perfecto', crate: 'REGGAETON' },
    { title: 'MIA', artist: 'Bad Bunny ft. Drake', key: '6B', bpm: '96.0', trans: 'relative', transLabel: '↗ Relativo', crate: 'LATIN TRAP' },
    { title: 'SENSACIÓN', artist: 'Ozuna', key: '8B', bpm: '94.0', trans: 'perfect', transLabel: '✓ Perfecto', crate: 'REGGAETON' },
    { title: 'QUÉ PRETENDES', artist: 'J Balvin ft. Bad Bunny', key: '7A', bpm: '97.0', trans: 'relative', transLabel: '↗ Relativo', crate: 'REGGAETON' },
    { title: 'HAWÁI', artist: 'Maluma', key: '5B', bpm: '93.0', trans: 'perfect', transLabel: '✓ Perfecto', crate: 'POP LATIN' },
  ];

  const nowTracks = [
    { title: 'DAKITI', artist: 'Bad Bunny ft. Jhay Cortez', key: '7B', bpm: '95.0' },
    { title: 'HAWÁI', artist: 'Maluma', key: '5B', bpm: '93.0' },
    { title: 'TUSA', artist: 'KAROL G ft. Nicki Minaj', key: '8B', bpm: '95.0' },
    { title: 'CON CALMA', artist: 'Daddy Yankee ft. Snow', key: '9A', bpm: '96.0' },
  ];

  let trackIdx = 0;
  let nowIdx = 0;

  function renderSearching() {
    return `
      <div class="tracks-container">
        <div class="track" style="flex:1 1 0; min-width:0; width:100%; align-items:center; justify-content:center;">
          <div class="searching" style="width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; padding: 12px; box-sizing: border-box; position: relative; overflow: hidden;">
            <div class="ai-scan-beam"></div>
            <div style="position: relative; width: 34px; height: 34px;">
              <div class="brain-glow-ring"></div>
              <span style="font-size: 20px; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; animation: brainPulse 1.5s ease-in-out infinite;">🧠</span>
            </div>
            <div style="font-size: 11px; font-weight: 900; color: #00d2ff; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 8px rgba(0,210,255,0.6);">
              ⚡ Razonando sugerencias<span class="searching-dots"></span>
            </div>
            <div style="font-size: 9px; color: rgba(255,255,255,0.6); font-weight: 700;">Neural Engine escaneando</div>
          </div>
        </div>
      </div>`;
  }

  function renderBonus(track) {
    const transClass = track.trans;
    return `
      <div class="tracks-container">
        <div class="track">
          <div>
            <div class="card-section-tag" style="color:#ffffff !important; letter-spacing: 2.5px; text-align:center; display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom: 6px;">
              <span style="width:16px;height:1px;background:rgba(255,255,255,0.35);display:inline-block;"></span>
              ⚡ BONUS
              <span style="width:16px;height:1px;background:rgba(255,255,255,0.35);display:inline-block;"></span>
            </div>
            <div class="t">${track.title}</div>
            <div class="a">${track.artist}</div>
          </div>
          <div class="track-bottom">
            <div class="tb-left">
              <span class="badge trans ${transClass}">${track.transLabel}</span>
              <span class="badge bpmx">${track.bpm}</span>
              <span class="badge crate">${track.crate}</span>
            </div>
            <div class="actions">
              <button class="load-btn deck-btn">⬇ A</button>
              <button class="load-btn deck-btn" style="color:#2f80ed; border-color:rgba(47,128,237,0.5); background:rgba(47,128,237,0.12);">⬇ B</button>
            </div>
          </div>
        </div>
      </div>`;
  }

  function setWithFade(el, htmlFn) {
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.4s ease';
    setTimeout(() => {
      el.innerHTML = htmlFn();
      el.style.opacity = '1';
    }, 400);
  }

  // Cycle bonus slot: show result → searching → result
  let bonusPhase = 0; // 0 = result, 1 = searching
  const bonusSlot = document.getElementById('bonusSlot');

  function cycleBonusSlot() {
    if (bonusPhase === 0) {
      // Show result
      const t = demoTracks[trackIdx % demoTracks.length];
      setWithFade(bonusSlot, () => renderBonus(t));
      trackIdx++;
      bonusPhase = 1;
    } else {
      // Show searching
      setWithFade(bonusSlot, () => renderSearching());
      bonusPhase = 0;
    }
  }

  // Cycle sug1 (now playing suggestion)
  function cycleSug1() {
    const nowTrack = nowTracks[nowIdx % nowTracks.length];
    nowIdx++;
    document.getElementById('nowTitle').textContent = nowTrack.title;
    document.getElementById('nowArtist').textContent = nowTrack.artist;
    // Update sug1 with a related track
    const related = demoTracks[(nowIdx + 2) % demoTracks.length];
    const sug1 = document.getElementById('sug1Card');
    if (sug1) {
      sug1.style.opacity = '0';
      sug1.style.transition = 'opacity 0.5s ease';
      setTimeout(() => {
        document.getElementById('sug1Title').textContent = related.title;
        document.getElementById('sug1Artist').textContent = related.artist;
        sug1.style.opacity = '1';
      }, 500);
    }
    // Update LP BPM
    const bpmEl = document.querySelector('.lp-bpmbig > b');
    if (bpmEl) bpmEl.textContent = nowTrack.bpm;
    const chipBpm = document.querySelector('.chip.bpm');
    if (chipBpm) chipBpm.textContent = nowTrack.bpm + ' BPM';
    const chipKey = document.querySelector('.chip.key');
    if (chipKey) chipKey.textContent = nowTrack.key;
  }

  // Initialize bonus slot
  bonusSlot.innerHTML = renderSearching();
  bonusPhase = 0;

  // Start cycling
  setTimeout(() => {
    cycleBonusSlot();
    setInterval(cycleBonusSlot, 4000);
  }, 2000);

  setInterval(cycleSug1, 10000);
</script>
</body>
</html>
