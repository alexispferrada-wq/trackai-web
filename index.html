<script>
  const TY_WA_PHONE = '56992818104';
  function toggleTyWhatsApp() {
    const modal = document.getElementById('ty-wa-modal');
    if (!modal) return;
    const isVisible = modal.style.display === 'flex';
    modal.style.display = isVisible ? 'none' : 'flex';
    if (!isVisible) {
      updateTyWaTime();
      document.getElementById('ty-wa-input')?.focus();
    }
  }
  function updateTyWaTime() {
    const timeElem = document.getElementById('ty-wa-current-time');
    if (timeElem) {
      const now = new Date();
      timeElem.innerText = now.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
    }
  }
  function sendQuickWhatsApp(customText) {
    const url = "https://wa.me/" + TY_WA_PHONE + "?text=" + encodeURIComponent(customText);
    window.open(url, '_blank');
  }
  function submitTyWhatsApp() {
    const input = document.getElementById('ty-wa-input');
    const msg = (input ? input.value : '').trim();
    if (!msg) return;
    sendQuickWhatsApp(msg);
    input.value = '';
    toggleTyWhatsApp();
  }
  function handleTyWaKey(e) {
    if (e.key === 'Enter') submitTyWhatsApp();
  }
  updateTyWaTime();
</script>
