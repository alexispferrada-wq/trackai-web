    <script>
      (function() {
        var sid = localStorage.getItem("ty_session");
        if (!sid) { sid = "sess_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9); localStorage.setItem("ty_session", sid); }
        try {
          navigator.sendBeacon("https://rucio.alexispferrada.workers.dev/api/memory/event", JSON.stringify({
            event_type: "page_view", scope: "trackai", session_id: sid,
            payload: { page: "trackai", path: window.location.pathname, referrer: document.referrer || "" }
          }));
        } catch (e) {}
      })();
    </script>
    <!-- Tracker visitantes en vivo — servidor.siti.work -->
    <script>
      (function () {
        var PANEL = "https://servidor.siti.work";
        var KEY = "tv_sid_trackai";
        var sid = localStorage.getItem(KEY);
        if (!sid) { sid = "tv_" + Date.now() + "_" + Math.random().toString(36).slice(2, 9); localStorage.setItem(KEY, sid); }
        function ping() {
          try {
            fetch(PANEL + "/api/live/ping", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ sid: sid, page: window.location.pathname, referrer: document.referrer || "directo" }),
              keepalive: true
            }).catch(function () {});
          } catch (e) {}
        }
        ping();
        setInterval(ping, 30000);
        document.addEventListener("visibilitychange", function () { if (!document.hidden) ping(); });
      })();
    </script>
