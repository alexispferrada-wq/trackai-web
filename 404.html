<!doctype html><html lang="es"><head><meta charset="UTF-8"><title>TrackAI</title><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{background:radial-gradient(ellipse at 30% 0%,rgba(0,125,255,.25),transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(0,210,255,.15),transparent 60%),#05070c;font-family:-apple-system,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;color:#fff;text-align:center;padding:24px}
.card{background:rgba(8,7,12,.75);border:1px solid rgba(47,128,237,.3);border-radius:28px;padding:56px 40px;max-width:520px;width:100%;backdrop-filter:blur(20px);box-shadow:0 20px 80px rgba(0,0,0,.5)}
.code{font-size:96px;font-weight:900;background:linear-gradient(135deg,#007dff,#00d2ff,#b877e0);-webkit-background-clip:text;color:transparent;margin:18px 0 6px;font-family:'Archivo Black',system-ui,sans-serif}
h1{font-size:22px;font-weight:800;margin-bottom:14px}
p{font-size:14.5px;color:#a0b0d8;line-height:1.7;margin-bottom:28px}
.btn{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,#00d2ff,#007dff);color:#000;font-weight:900;font-size:15px;padding:14px 30px;border-radius:999px;text-decoration:none;text-transform:uppercase;box-shadow:0 10px 30px rgba(0,125,255,.4);transition:.2s}
.links{margin-top:22px;display:flex;gap:18px;justify-content:center;font-size:13px}
.links a{color:#37d6c3;text-decoration:none;font-weight:700}
</style></head><body>
<div class="card"><div style="font-size:30px;font-weight:900;letter-spacing:-1px;margin-bottom:8px">Track<span style="color:#007dff">AI</span></div>
<div class="code">404</div><h1>Esta pista no existe 🎧</h1>
<p>La página que buscas no está en el set o fue movida a otra carpeta.</p>
<a class="btn" href="/">← Volver al Inicio</a>
<div class="links"><a href="/download">Descargar</a><a href="/versions">Versiones</a><a href="/help">Ayuda</a></div></div>
<script>
(function(){
var v=['/download','/versions','/terms','/help','/reset','/privacy'];
var p=window.location.pathname.replace(/\/+$/,'');
if(v.indexOf(p)!==-1)window.location.replace('/');
if(p==='/admin-dashboard'){
  try{ if(localStorage.getItem('trackai_admin_token'))window.location.replace('/?go=admin'); else window.location.replace('/dash.html'); }catch(e){window.location.replace('/dash.html');}
}
})();
</script></body></html>
