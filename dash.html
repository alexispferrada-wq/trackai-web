<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TrackAI — Admin Dashboard</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at 30% 0%,rgba(0,125,255,.2),transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(0,210,255,.12),transparent 60%),#05070c;font-family:-apple-system,'Segoe UI',sans-serif;min-height:100vh;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:rgba(8,7,12,.8);border:1px solid rgba(47,128,237,.3);border-radius:24px;padding:40px;max-width:420px;width:100%;backdrop-filter:blur(20px);box-shadow:0 20px 80px rgba(0,0,0,.5)}
.brand{font-weight:900;font-size:24px;letter-spacing:-1px;margin-bottom:24px;text-align:center}
.brand span{color:#007dff}
input{width:100%;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:15px;margin-bottom:14px;box-sizing:border-box}
input:focus{outline:none;border-color:#007dff;box-shadow:0 0 0 3px rgba(0,125,255,.15)}
.btn{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,#00d2ff,#007dff);color:#fff;font-weight:800;font-size:15px;border:none;cursor:pointer;letter-spacing:.5px;box-shadow:0 8px 24px rgba(0,125,255,.3)}
.btn:disabled{opacity:.5;cursor:wait}
.msg{padding:12px;border-radius:10px;font-size:13px;margin-bottom:14px;text-align:center;font-weight:700}
.msg-err{background:rgba(255,86,120,.1);border:1px solid rgba(255,86,120,.3);color:#ff5678}
.msg-ok{background:rgba(55,214,195,.1);border:1px solid #37d6c3;color:#37d6c3}
.info{padding:14px;border-radius:10px;margin-top:16px;font-size:12px;color:#6c6e77;text-align:center}
.hidden{display:none}
.links{margin-top:18px;text-align:center}
.links a{color:#37d6c3;font-size:13px;text-decoration:none;font-weight:700}
</style></head>
<body>
<div class="card">
  <div class="brand">Track<span>AI</span> · Admin</div>
  <div id="msg"></div>
  <form id="loginForm">
    <input type="password" id="password" placeholder="Contraseña maestra" autocomplete="off" />
    <input type="text" id="totp" placeholder="Código Google Authenticator (6 dígitos)" maxlength="6" autocomplete="off" class="hidden" style="text-align:center;letter-spacing:4px;font-size:18px" />
    <button type="submit" class="btn" id="btn">Acceder al Panel</button>
  </form>
  <div class="info"><strong>🔐 Área restringida.</strong> Solo para administración del sistema.</div>
  <div class="links"><a href="/">← Volver al inicio</a></div>
</div>

<script>
const D = 'https://trackai-license-api.alexispferrada.workers.dev';
const f = document.getElementById('loginForm');
const msg = document.getElementById('msg');
const btn = document.getElementById('btn');
const totp = document.getElementById('totp');
const pwd = document.getElementById('password');
let requireTotp = false;

f.onsubmit = async (e) => {
  e.preventDefault();
  btn.disabled = true;
  btn.textContent = requireTotp ? 'Verificando...' : 'Ingresando...';
  msg.className = 'msg hidden';

  try {
    const body = { password: pwd.value };
    if (requireTotp) body.totp = totp.value;
    const r = await fetch(D + '/api/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (r.status === 401 && d.requireTotp) {
      requireTotp = true;
      totp.classList.remove('hidden');
      totp.focus();
      msg.className = 'msg msg-err';
      msg.textContent = d.error || 'Ingresa tu código de Google Authenticator';
      btn.textContent = 'Verificar Código 2FA';
      btn.disabled = false;
      return;
    }
    if (!r.ok) {
      msg.className = 'msg msg-err';
      msg.textContent = d.error || 'Contraseña incorrecta';
      btn.textContent = 'Acceder al Panel';
      btn.disabled = false;
      requireTotp = false;
      totp.classList.add('hidden');
      return;
    }
    // Login exitoso
    if (d.token) localStorage.setItem('trackai_admin_token', d.token);
    msg.className = 'msg msg-ok';
    msg.textContent = '✅ Acceso concedido. Redirigiendo...';
    setTimeout(() => { window.location.href = '/admin-dashboard'; }, 800);
  } catch {
    msg.className = 'msg msg-err';
    msg.textContent = 'Error de conexión. Revisa tu internet.';
    btn.textContent = 'Acceder al Panel';
    btn.disabled = false;
  }
};

// Si ya hay token guardado, ir directo
if (localStorage.getItem('trackai_admin_token')) {
  msg.className = 'msg msg-ok';
  msg.textContent = 'Sesión guardada. Redirigiendo al panel...';
  setTimeout(() => { window.location.href = '/admin-dashboard'; }, 500);
}
</script>
</body>
</html>
