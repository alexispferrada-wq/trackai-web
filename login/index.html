<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TrackAI · Conectar Cuenta (Google, Apple o Correo)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/favicon-trackai.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Apple Sign In SDK -->
  <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/auth.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 50% 20%, #0d1527 0%, #030712 70%);
      color: #ffffff;
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .auth-card {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(0, 210, 255, 0.35);
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 0 0 50px rgba(0, 210, 255, 0.12);
      position: relative;
      overflow: hidden;
    }
    .glow-header {
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #00d2ff, #00ff88, #1738e8);
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid rgba(0, 210, 255, 0.3);
      padding: 6px 14px;
      border-radius: 99px;
      margin-bottom: 18px;
      font-size: 11px;
      font-weight: 800;
      color: #00d2ff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    h1 span { color: #00d2ff; }
    .subtitle {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 24px;
    }
    .desktop-alert {
      display: none;
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid rgba(0, 255, 136, 0.3);
      color: #00ff88;
      font-size: 11.5px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .btn-social {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 12px;
      text-decoration: none;
    }
    .btn-google {
      background: #ffffff;
      color: #1f2937;
    }
    .btn-google:hover {
      background: #f3f4f6;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
    }
    .btn-apple {
      background: #000000;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
    }
    .btn-apple:hover {
      background: #111827;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 18px 0;
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .divider span { padding: 0 10px; }
    .email-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .email-input {
      width: 100%;
      height: 46px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 0 16px;
      color: #fff;
      font-family: inherit;
      font-size: 13.5px;
      outline: none;
      transition: border 0.2s;
    }
    .email-input:focus {
      border-color: #00d2ff;
      box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.2);
    }
    .btn-submit {
      width: 100%;
      height: 46px;
      background: linear-gradient(135deg, #00d2ff, #1738e8);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(23, 56, 232, 0.35);
      transition: all 0.2s;
    }
    .btn-submit:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status-box {
      display: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      margin-top: 14px;
    }
    .status-box.success {
      display: block;
      background: rgba(0, 255, 136, 0.12);
      border: 1px solid #00ff88;
      color: #00ff88;
    }
    .status-box.error {
      display: block;
      background: rgba(255, 90, 95, 0.12);
      border: 1px solid #ff5a5f;
      color: #ff5a5f;
    }
    .footer-note {
      margin-top: 24px;
      color: #64748b;
      font-size: 11px;
      line-height: 1.5;
    }
    .footer-note a {
      color: #94a3b8;
      text-decoration: none;
    }
    .footer-note a:hover { color: #00d2ff; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="glow-header"></div>

    <div class="logo-badge">
      <span>🎧</span> TrackAI Authentication
    </div>

    <h1>Inicia Sesión en <span>TrackAI</span></h1>
    <p class="subtitle" id="subtitleText">Conecta tu cuenta para sincronizar tus licencias y preferencias de mezcla.</p>

    <div class="desktop-alert" id="desktopAlert">
      ⚡ Conectando con la app de escritorio TrackAI...
    </div>

    <!-- BOTÓN GOOGLE -->
    <button class="btn-social btn-google" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continuar con Google
    </button>

    <!-- BOTÓN APPLE -->
    <button class="btn-social btn-apple" onclick="loginWithApple()">
      <svg width="18" height="18" viewBox="0 0 170 170" fill="currentColor">
        <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.7-3.04-7.58-7.71-11.64-14.01-6.19-9.5-11.08-20.08-14.67-31.73-3.59-11.66-5.39-22.9-5.39-33.72 0-14.79 3.73-27.17 11.2-37.13 7.47-9.96 16.94-15.09 28.41-15.39 4.36 0 9.29 1.14 14.79 3.42 5.5 2.28 9.22 3.47 11.16 3.57 1.74 0 5.66-1.28 11.76-3.84 6.1-2.56 11.45-3.73 16.05-3.51 12.18.65 22.09 4.96 29.73 12.94-10.66 6.53-15.88 15.55-15.66 27.08.22 9.14 3.75 16.94 10.59 23.4 6.84 6.46 14.88 10.06 24.12 10.8-2.61 7.62-5.77 15.35-9.48 23.19zM119.22 33.15c0-7.18 2.61-14.08 7.83-20.7 5.22-6.62 11.75-11.14 19.59-13.56.22 1.3.33 2.6.33 3.91 0 7.07-2.68 13.97-8.04 20.7-5.36 6.73-12.01 11.24-19.95 13.54-.11-1.3-.17-2.6-.17-3.89z"/>
      </svg>
      Continuar con Apple
    </button>

    <div class="divider"><span>o con tu correo</span></div>

    <!-- FORMULARIO CORREO -->
    <form class="email-form" onsubmit="handleEmailLogin(event)">
      <input type="email" id="emailInput" class="email-input" placeholder="tu@correo.com" required autocomplete="email">
      <button type="submit" id="btnSubmit" class="btn-submit">
        Continuar con Correo →
      </button>
    </form>

    <div id="statusBox" class="status-box"></div>

    <div class="footer-note">
      ¿Problemas para acceder? Escríbenos a <a href="mailto:soporte@trackai.party?subject=Soporte%20Login%20TrackAI">soporte@trackai.party</a>.<br>
      © 2026 Siti.work · TrackAI Core v2.7.0
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const isDesktopClient = params.get('client') === 'desktop';
    const loopbackPort = params.get('port') || '41732';
    const authState = params.get('state') || '';

    if (isDesktopClient) {
      document.getElementById('desktopAlert').style.display = 'block';
      document.getElementById('subtitleText').textContent = 'Identifícate en la web y tu sesión se abrirá automáticamente en tu software DJ.';
    }

    function showStatus(msg, type = 'success') {
      const box = document.getElementById('statusBox');
      box.textContent = msg;
      box.className = 'status-box ' + type;
    }

    async function sendDesktopHandshake(user) {
      if (!isDesktopClient) return;

      const callbackUrl = `http://127.0.0.1:${loopbackPort}/callback?email=${encodeURIComponent(user.email)}&plan=${encodeURIComponent(user.plan || 'standard')}&token=${encodeURIComponent(user.token || '')}&name=${encodeURIComponent(user.dj_name || 'DJ')}&state=${encodeURIComponent(authState)}`;
      const protocolUrl = `trackai://auth?email=${encodeURIComponent(user.email)}&plan=${encodeURIComponent(user.plan || 'standard')}&token=${encodeURIComponent(user.token || '')}&name=${encodeURIComponent(user.dj_name || 'DJ')}&state=${encodeURIComponent(authState)}`;

      // 1. Loopback HTTP local instantáneo
      try {
        await fetch(callbackUrl, { mode: 'no-cors' });
      } catch (_) {}

      // 2. Deep link protocol como redundancia
      setTimeout(() => {
        window.location.href = protocolUrl;
      }, 300);
    }

    async function handleEmailLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = 'Verificando cuenta...';

      try {
        // Consultar estado de cuenta en la API de TrackAI
        const r = await fetch('https://api.trackai.party/api/account/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        }).catch(() => null);

        let plan = 'standard';
        if (r && r.ok) {
          const data = await r.json().catch(() => ({}));
          plan = data.plan || 'standard';
        }

        const user = { email, plan, dj_name: email.split('@')[0], token: 'token_' + Date.now() };
        showStatus(`¡Bienvenido! Plan detectado: ${plan.toUpperCase()}. Conectando app...`);

        if (isDesktopClient) {
          await sendDesktopHandshake(user);
        } else {
          setTimeout(() => { window.location.href = '/pro'; }, 1200);
        }
      } catch (err) {
        showStatus('Error al conectar. Intenta de nuevo o escribe a soporte@trackai.party', 'error');
        btn.disabled = false;
        btn.textContent = 'Continuar con Correo →';
      }
    }

    function loginWithGoogle() {
      // Flujo rápido con Google: solicita prompt de Google Identity o redirecciona
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.initialize({
          client_id: '725916301684-trackai.apps.googleusercontent.com', // Placeholder OAuth Client ID
          callback: (response) => {
            // Decodificar JWT de Google
            try {
              const base64Url = response.credential.split('.')[1];
              const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
              const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
              const payload = JSON.parse(jsonPayload);
              const user = { email: payload.email, plan: 'standard', dj_name: payload.name || 'DJ', token: response.credential };
              showStatus(`¡Hola, ${payload.name || 'DJ'}! Conectando TrackAI...`);
              sendDesktopHandshake(user);
            } catch (_) {
              promptDirectEmail();
            }
          }
        });
        google.accounts.id.prompt();
      } else {
        promptDirectEmail();
      }
    }

    function loginWithApple() {
      // Flujo Sign in with Apple JS
      if (window.AppleID && AppleID.auth) {
        AppleID.auth.init({
          clientId: 'party.trackai.signin',
          scope: 'name email',
          redirectURI: window.location.origin + '/login',
          usePopup: true
        });
        AppleID.auth.signIn().then(res => {
          const email = res.user && res.user.email;
          if (email) {
            sendDesktopHandshake({ email, plan: 'standard', dj_name: 'DJ Apple', token: res.authorization.id_token });
          }
        }).catch(() => {
          promptDirectEmail();
        });
      } else {
        promptDirectEmail();
      }
    }

    function promptDirectEmail() {
      const emailField = document.getElementById('emailInput');
      emailField.focus();
      showStatus('Ingresa tu correo para validar tu cuenta.', 'error');
    }
  </script>
</body>
</html>
